services:
  submeld:
    build: .
    image: submeld:2.0.0
    dns: [223.5.5.5, 1.1.1.1]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      ALLOW_HTTP: ${ALLOW_HTTP:-false}
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      SUB_STORE_URL: http://sub-store:3000/gateway
      MIAOSPEED_URL: ''
      MIAOSPEED_TOKEN: ''
      HY2_RESOLVER_ORIGIN: ${HY2_RESOLVER_ORIGIN:-http://submeld:${PORT:-3000}}
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    volumes:
      - submeld-v2-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    pids_limit: 64
    restart: unless-stopped
    init: true
    depends_on: [sub-store]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  sub-store:
    image: xream/sub-store@sha256:7b724d57b1ac60d608211b3f16210f870818648b62ab5a9fa0512617ea7e6fc5
    environment:
      SUB_STORE_BACKEND_API_HOST: 0.0.0.0
      SUB_STORE_BACKEND_API_PORT: 3000
      SUB_STORE_BACKEND_MERGE: 'true'
      SUB_STORE_FRONTEND_BACKEND_PATH: /gateway
      SUB_STORE_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    volumes:
      - sub-store-v2-data:/opt/app/data
    restart: unless-stopped
volumes:
  submeld-v2-data:
  sub-store-v2-data:
